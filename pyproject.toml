[project]
name = "stock-report-mcp"
version = "0.1.0"
description = "A股研报MCP Server - 基于FastMCP与AkShare的股票研报MCP服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.92",
    "fastmcp>=3.4.7",
    "python-dotenv>=1.0.0",
]

[project.scripts]
stock-report-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]